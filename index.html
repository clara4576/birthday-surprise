<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<style>

body{
margin:0;
font-family:Comic Sans MS;
text-align:center;
overflow:hidden;
background:linear-gradient(-45deg,#ffd6e7,#e4c1f9,#cdb4db,#bde0fe);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
margin-top:80px;
font-size:38px;
animation:bounce 2s infinite alternate;
}

@keyframes bounce{
from{transform:translateY(0)}
to{transform:translateY(-10px)}
}

img{
width:260px;
margin-top:20px;
border-radius:15px;
}

/* Birthday question */

.question{
margin-top:25px;
font-size:24px;
font-weight:bold;
color:#4b294f;
padding:0 20px;
}

/* Buttons */

.button-container{
display:flex;
justify-content:center;
gap:20px;
margin-top:25px;
}

.choice-button{
padding:16px 30px;
font-size:19px;
font-family:Comic Sans MS;
border:none;
border-radius:40px;
background:white;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
transition:0.3s;
}

.choice-button:hover{
transform:scale(1.08);
}

/* Yes button */

.agree{
animation:glowPink 2s infinite alternate;
}

@keyframes glowPink{
from{
box-shadow:0 0 10px pink;
}
to{
box-shadow:0 0 25px #ff69b4;
}
}

/* No button */

.disagree{
animation:glowPurple 2s infinite alternate;
}

@keyframes glowPurple{
from{
box-shadow:0 0 10px #d8b4fe;
}
to{
box-shadow:0 0 25px #9b59b6;
}
}

/* Floating emojis */

.floating{
position:fixed;
bottom:-40px;
font-size:24px;
animation:floatUp 6s linear forwards;
pointer-events:none;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}


/* =========================
   POPUP
========================= */

.popup-overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(80,40,90,0.35);
backdrop-filter:blur(4px);
justify-content:center;
align-items:center;
z-index:1000;
}

.popup{
background:white;
padding:35px 30px;
border-radius:30px;
width:80%;
max-width:380px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
animation:popupIn 0.4s ease;
}

@keyframes popupIn{
0%{
transform:scale(0.5);
opacity:0;
}
70%{
transform:scale(1.08);
opacity:1;
}
100%{
transform:scale(1);
opacity:1;
}
}

.popup h2{
margin:0 0 15px;
font-size:28px;
color:#d14d8b;
}

.popup p{
font-size:20px;
color:#4b294f;
margin-bottom:25px;
line-height:1.5;
}

.popup button{
padding:14px 30px;
font-size:18px;
font-family:Comic Sans MS;
border:none;
border-radius:30px;
background:#ffd6e7;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
transition:0.3s;
}

.popup button:hover{
transform:scale(1.08);
}


/* Mobile */

@media(max-width:600px){

h1{
font-size:30px;
margin-top:60px;
}

img{
width:220px;
}

.question{
font-size:20px;
}

.button-container{
gap:10px;
}

.choice-button{
padding:14px 20px;
font-size:17px;
}

}

</style>

</head>

<body>

<h1>✨ A Little Surprise For You ✨</h1>

<img src="snow-winter.gif">

<div class="question">
Are you ready for a little birthday magic? ✨
</div>


<div class="button-container">

<button class="choice-button agree" onclick="showGoodDecision()">
💗 Yes, Show Me!
</button>

<button class="choice-button disagree" onclick="showNoOption()">
🙅 No, Thanks
</button>

</div>


<!-- =========================
     GOOD DECISION POPUP
========================= -->

<div class="popup-overlay" id="goodPopup">

<div class="popup">

<h2>🎉 Good Decision! 💕</h2>

<p>
I knew you would say yes! 😌✨
</p>

<button onclick="goNext()">
✨ Let’s Go!
</button>

</div>

</div>


<!-- =========================
     NO OPTION POPUP
========================= -->

<div class="popup-overlay" id="noPopup">

<div class="popup">

<h2>Oops! 😌</h2>

<p>
You don't have that option! 😂💕
</p>

<button onclick="closeNoPopup()">
Okay okay… 😭💕
</button>

</div>

</div>


<script>

/* Go to the next page */

function goNext(){
window.location="menu.html";
}


/* Yes button popup */

function showGoodDecision(){
document.getElementById("goodPopup").style.display="flex";
}


/* No button popup */

function showNoOption(){
document.getElementById("noPopup").style.display="flex";
}


/* Close No popup */

function closeNoPopup(){
document.getElementById("noPopup").style.display="none";
}


/* Floating emojis */

const emojis = ["💖","💗","🎂","🥳","🎁","✨","🎈"];

setInterval(()=>{

let e=document.createElement("div");

e.className="floating";

e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

e.style.left=Math.random()*100+"vw";

e.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(e);

setTimeout(()=>{
e.remove();
},6000);

},300);

</script>

</body>
</html>
