<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Comic Sans MS;
text-align:center;
overflow:hidden;
background:linear-gradient(-45deg,#ffd6e7,#e4c1f9,#cdb4db,#bde0fe);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
margin-top:100px;
font-size:42px;
animation:pop 2s infinite alternate;
}

@keyframes pop{
from{transform:scale(1)}
to{transform:scale(1.05)}
}

button{
display:block;
margin:25px auto;
width:280px;
padding:18px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
cursor:pointer;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
animation:glow 2s infinite alternate;
}

button:hover{
transform:scale(1.1);
}

@keyframes glow{
from{box-shadow:0 0 10px pink}
to{box-shadow:0 0 25px purple}
}


/* Secret heart divider */

.secret-divider{
display:flex;
align-items:center;
justify-content:center;
margin:45px auto 0;
font-size:17px;
}

.secret-line{
color:#f3a6c8;
letter-spacing:3px;
}

.secret-heart{
color:#f3a6c8;
font-size:17px;
text-decoration:none;
cursor:pointer;
margin:0 5px;
transition:0.3s;
}

.secret-heart:hover{
transform:scale(1.15);
text-shadow:0 0 8px #f3a6c8;
}


/* Floating emojis */

.floating{
position:fixed;
font-size:24px;
animation:floatUp 6s linear forwards;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}

</style>

</head>

<body>

<h1>✨ Choose One ✨</h1>

<button onclick="go('announcement.html')">
Important Announcement 🤫
</button>

<button onclick="go('gift.html')">
Claim Your Birthday Gift 🎁
</button>

<button onclick="go('dontclick.html')">
💌 A Message For You
</button>


<!-- Secret decorative divider -->

<div class="secret-divider">

<span class="secret-line">────</span>

<span class="secret-heart">💗</span>

<span class="secret-line">────</span>

<span onclick="secretClick()" class="secret-heart">💗</span>

<span class="secret-line">────</span>

<span class="secret-heart">💗</span>

<span class="secret-line">────</span>

</div>


<script>

function go(page){
window.location=page
}


/* Secret heart requires 3 clicks within 3 seconds */

let secretClicks = 0;
let secretTimer;

function secretClick(){

    secretClicks++;

    clearTimeout(secretTimer);

    if(secretClicks === 3){

        window.location.href = "secret.html";

        return;

    }

    secretTimer = setTimeout(() => {

        secretClicks = 0;

    },3000);

}


/* Floating emojis */

const emojis = ["💖","💗","💓","💕","🎉","✨","🎈"]

setInterval(()=>{

let e=document.createElement("div")

e.className="floating"

e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)]

e.style.left=Math.random()*100+"vw"
e.style.bottom="-20px"

document.body.appendChild(e)

setTimeout(()=>{
e.remove()
},6000)

},400)

</script>

</body>
</html>
